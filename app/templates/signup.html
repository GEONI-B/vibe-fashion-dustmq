{% extends 'base.html' %}

{% block title %}회원가입 - VIBE FASHION{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-75 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="badge bg-primary rounded-pill px-3 py-2 mb-2">WELCOME</span>
                        <h3 class="fw-bolder mb-1">회원가입</h3>
                        <p class="text-muted small">VIBE FASHION의 회원이 되어 특별한 혜택을 받아보세요.</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.signup') }}">
                        <!-- 이름 입력 -->
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">이름 (닉네임)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" id="name" name="name" 
                                       value="{{ name or '' }}" placeholder="홍길동" required autofocus>
                            </div>
                        </div>

                        <!-- 이메일 입력 -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">이메일 주소</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" 
                                       value="{{ email or '' }}" placeholder="example@vibe.com" required>
                            </div>
                        </div>

                        <!-- 비밀번호 입력 -->
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">비밀번호 (6자 이상)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" 
                                       placeholder="최소 6자 이상" minlength="6" required>
                            </div>
                        </div>

                        <!-- 비밀번호 확인 입력 -->
                        <div class="mb-4">
                            <label for="password_confirm" class="form-label small fw-semibold">비밀번호 확인</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-shield-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password_confirm" name="password_confirm" 
                                       placeholder="비밀번호 재입력" minlength="6" required>
                            </div>
                        </div>

                        <!-- 가입 버튼 -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-semibold shadow-sm">
                                회원가입 완료
                            </button>
                        </div>
                    </form>

                    <!-- 로그인 안내 링크 -->
                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">이미 계정이 있으신가요?</span>
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none ms-1 text-dark small">
                            로그인하기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
