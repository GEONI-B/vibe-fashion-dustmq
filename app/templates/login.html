{% extends 'base.html' %}

{% block title %}로그인 - VIBE FASHION{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-75 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="badge bg-dark rounded-pill px-3 py-2 mb-2">VIBE FASHION</span>
                        <h3 class="fw-bolder mb-1">로그인</h3>
                        <p class="text-muted small">계정에 로그인하여 더 많은 혜택을 누려보세요.</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <!-- 이메일 입력 -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">이메일 주소</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" 
                                       value="{{ email or '' }}" placeholder="example@vibe.com" required autofocus>
                            </div>
                        </div>

                        <!-- 비밀번호 입력 -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label small fw-semibold mb-0">비밀번호</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- 로그인 버튼 -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-dark rounded-pill py-2 fw-semibold shadow-sm">
                                로그인
                            </button>
                        </div>
                    </form>

                    <!-- 회원가입 안내 링크 -->
                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">아직 계정이 없으신가요?</span>
                        <a href="{{ url_for('auth.signup') }}" class="fw-bold text-decoration-none ms-1 text-primary small">
                            회원가입하기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
